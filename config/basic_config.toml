title = "ollama rag config"

[llm]
service = "OllamaLLM"
model = "qwen3:8b"

[retrieval]
service = "OllamaRetrieval"
model = "bge-m3"
top_k = 6
hybrid = true

[ranker]
service = "IdentityRanker"

[compressor]
service = "IdentityCompressor"

[context_builder]
service = "SimpleContextBuilder"

[query_expander]
service = "IdentityQueryProcessor"